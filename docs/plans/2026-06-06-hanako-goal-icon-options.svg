<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="360" rx="24" fill="#F7F5EF"/>
  <style>
    .title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #28231f; }
    .meta { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #776f66; }
    .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #28231f; }
    .chip { fill: #F3EFE7; stroke: #CFC5B8; }
    .icon { stroke: #2F2A25; }
    .faint { stroke: #9C9288; }
  </style>
  <text x="42" y="48" class="title">Hanako Goal Icon Options</text>
  <text x="42" y="72" class="meta">Small-size SVG icons for the + menu and the active goal chip. All use the same geometry in both places.</text>

  <g transform="translate(70 118)">
    <rect class="chip" x="0" y="0" width="200" height="88" rx="12"/>
    <g transform="translate(72 22)" class="icon" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 4 L44 24 L24 44 L4 24 Z"/>
      <path d="M24 13 L35 24 L24 35 L13 24 Z"/>
      <circle cx="24" cy="24" r="2.8" fill="#2F2A25" stroke="none"/>
    </g>
    <text x="78" y="132" class="label">A. 菱形焦点</text>
    <text x="0" y="158" class="meta">更像“一个明确目标被框住”，干净、偏 Hanako。</text>
  </g>

  <g transform="translate(370 118)">
    <rect class="chip" x="0" y="0" width="200" height="88" rx="12"/>
    <g transform="translate(70 20)" class="icon" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 35 C18 18, 30 10, 43 8"/>
      <path d="M43 8 L38 17"/>
      <path d="M43 8 L33 6"/>
      <circle cx="12" cy="35" r="5" fill="#F7F5EF"/>
      <circle cx="28" cy="18" r="4" fill="#F7F5EF"/>
      <circle cx="43" cy="8" r="4" fill="#2F2A25" stroke="none"/>
    </g>
    <text x="75" y="132" class="label">B. 路径节点</text>
    <text x="0" y="158" class="meta">像“从现在走向目标”，动态一点，产品感强。</text>
  </g>

  <g transform="translate(670 118)">
    <rect class="chip" x="0" y="0" width="200" height="88" rx="12"/>
    <g transform="translate(70 20)" class="icon" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18"/>
      <path d="M24 10 V24 H38"/>
      <path d="M14 38 C20 42, 29 42, 36 37" class="faint" stroke-width="2.5"/>
      <circle cx="24" cy="24" r="3.2" fill="#2F2A25" stroke="none"/>
    </g>
    <text x="74" y="132" class="label">C. 记忆罗盘</text>
    <text x="0" y="158" class="meta">像“方向/约束/记住目标”，更稳，但稍传统。</text>
  </g>
</svg>
